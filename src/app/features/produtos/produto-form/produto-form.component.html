<div class="produto-form">
  <h1>Novo Produto</h1>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" type="text" formControlName="nome" />
      @if (form.controls.nome.invalid && form.controls.nome.touched) {
        <span class="erro-campo">Nome é obrigatório (máximo 100 caracteres).</span>
      }
    </div>

    <div class="campo">
      <label for="preco">Preço</label>
      <input id="preco" type="number" step="0.01" formControlName="preco" />
      @if (form.controls.preco.invalid && form.controls.preco.touched) {
        <span class="erro-campo">Preço não pode ser negativo.</span>
      }
    </div>

    @if (erro()) {
      <p class="erro-geral">{{ erro() }}</p>
    }

    <div class="acoes">
      <button type="submit" [disabled]="salvando()">
        {{ salvando() ? 'Salvando...' : 'Salvar' }}
      </button>
      <a routerLink="/produtos">Cancelar</a>
    </div>
  </form>
</div>
